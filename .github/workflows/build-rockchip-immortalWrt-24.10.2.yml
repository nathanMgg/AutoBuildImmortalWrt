name: build-rockchip-immortalWrt-24.10.2

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: "请选择设备型号"
        options:
          - friendlyarm_nanopi-r4se
          - friendlyarm_nanopi-r4s
          - friendlyarm_nanopi-r5s
          - friendlyarm_nanopi-r6s
        required: true
        default: 'friendlyarm_nanopi-r4se'

      rootfs_partsize:
        description: '固件大小 (MB)'
        required: true
        default: ’2200’

      enable_store:
        description: "是否集成应用商店"
        required: false
        type: boolean
        default: true

      include_docker:
        description: "是否编译 Docker 插件 (默认关闭)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

      enable_pppoe:
        description: "是否启用 PPPoE 拨号"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

      pppoe_account:
        description: "宽带账号 (启用 PPPoE 时必填)"
        required: false

      pppoe_password:
        description: "宽带密码 (启用 PPPoE 时必填)"
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set permissions
        run: chmod +x ${{ github.workspace }}/rockchip/build24.sh

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "❌ PPPoE启用时必须提供账号和密码"
              exit 1
            fi
          fi

      - name: Enable Store
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
            echo "✅ 已集成应用商店"
          else
            echo "❎ 未启用应用商店"
          fi

      - name: Prepare Docker config
        run: |
          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            mkdir -p files/etc/docker
            cat > files/etc/docker/daemon.json <<EOF
{
  "bip": "172.31.0.1/16",
  "iptables": false,
  "ip-forward": true
}
EOF
            echo "✅ 已添加安全的 Docker 配置"
          else
            echo "❎ 不编译 Docker"
          fi

      - name: Add Bypass Router Optimization
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-bypass-router <<'EOF'
#!/bin/sh
# 旁路由优化脚本

# 1. 禁用 DHCP 服务
uci set dhcp.lan.ignore='1'

# 2. 设置 LAN 口固定 IP (示例：192.168.2.2)
uci set network.lan.ipaddr='192.168.2.2’
uci set network.lan.netmask='255.255.255.0'
uci set network.lan.gateway='192.168.2.1’
uci set network.lan.dns='192.168.2.1’

# 3. 防火墙默认允许所有流量
uci set firewall.@zone[0].input='ACCEPT'
uci set firewall.@zone[0].forward='ACCEPT'
uci set firewall.@zone[0].output='ACCEPT'

# 4. 禁止 WAN 接口获取 IP
uci set network.wan.proto='none'

# 5. 关闭不必要的服务，降低系统负载
for svc in firewall dnsmasq odhcpd; do
  /etc/init.d/$svc disable
done

uci commit
EOF
          echo "✅ 已加入旁路由优化配置"

      - name: Build ImmortalWrt
        run: |
          profiles="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"

          IFS=',' read -r -a profile_array <<< "$profiles"
          for profile in "${profile_array[@]}"; do
            echo "🔨 编译配置: $profile"

            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/rockchip/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/rockchip/build24.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$rootfs_partsize \
              -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
              immortalwrt/imagebuilder:rockchip-armv8-openwrt-24.10.2 /bin/bash /home/build/immortalwrt/build.sh
          done

      - name: Upload release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: Autobuild
          name: ImmortalWrt-Rockchip
          body_path: ${{ github.workspace }}/info.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
